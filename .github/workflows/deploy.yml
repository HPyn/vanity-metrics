name: Deploy infra

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "function/**"
      - ".github/workflows/deploy.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-infra-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group exists
        run: az group create --name rg-vanity-metrics --location australiaeast

      - name: Deploy Bicep
        run: |
          az deployment group create \
            --resource-group rg-vanity-metrics \
            --template-file infra/main.bicep \
            --parameters githubToken="${{ secrets.FUNCTION_GITHUB_TOKEN }}" \
            --mode Incremental

      - name: Deploy function code
        uses: Azure/functions-action@v1
        with:
          app-name: vanity-metrics-filler
          package: function
