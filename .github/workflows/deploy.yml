name: Deploy infra

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "function/**"
      - ".github/workflows/deploy.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-infra-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group exists
        run: az group create --name rg-vanity-metrics --location australiaeast

      - name: Deploy Bicep
        env:
          GITHUB_TOKEN_PARAM: ${{ secrets.FUNCTION_GITHUB_TOKEN }}
        run: |
          az deployment group create \
            --resource-group rg-vanity-metrics \
            --template-file infra/main.bicep \
            --parameters githubToken="$GITHUB_TOKEN_PARAM" \
            --mode Incremental

      - name: Deploy function code
        run: |
          cd function && zip -r ../function.zip . -x ".*" && cd ..
          # Azure/functions-action sets WEBSITE_RUN_FROM_PACKAGE=1 when it
          # detects RBAC/OIDC auth, which deploys the zip as a mounted
          # package rather than extracting it - the PowerShell worker on
          # Windows Consumption doesn't reliably load from that mount and
          # fails with "Could not find file ...\wwwroot". Using config-zip
          # directly (and clearing that setting first, since config-zip
          # doesn't override it once present) gets a real extract-to-disk
          # deploy instead.
          az functionapp config appsettings delete \
            --name vanity-metrics-filler \
            --resource-group rg-vanity-metrics \
            --setting-names WEBSITE_RUN_FROM_PACKAGE || true
          az functionapp deployment source config-zip \
            --name vanity-metrics-filler \
            --resource-group rg-vanity-metrics \
            --src function.zip
