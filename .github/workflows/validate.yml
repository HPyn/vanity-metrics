name: Validate infra

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - "function/**"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/validate.yml"

permissions:
  id-token: write
  contents: read

jobs:
  what-if:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint Bicep
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $hadErrors = $false
          Get-ChildItem -Path function -Filter *.ps1 -Recurse | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $hadErrors = $true
              Write-Error "Syntax errors in $($_.FullName):"
              $errors | ForEach-Object { Write-Error $_.Message }
            }
          }
          if ($hadErrors) { exit 1 }

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: What-if against rg-vanity-metrics
        env:
          GITHUB_TOKEN_PARAM: ${{ secrets.FUNCTION_GITHUB_TOKEN }}
        run: |
          az deployment group what-if \
            --resource-group rg-vanity-metrics \
            --template-file infra/main.bicep \
            --parameters githubToken="$GITHUB_TOKEN_PARAM" \
            --mode Incremental
